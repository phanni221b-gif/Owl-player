name: Build Owl 0.3.2 Artifact

on:
  push:
    paths:
      - '.github/workflows/build-owl-032-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson pillow --break-system-packages

      - name: Set Owl 0.3.2 version
        run: |
          sed -i 's/versionCode 55/versionCode 57/' app/build.gradle
          sed -i 's/versionName "0.3.0"/versionName "0.3.2"/' app/build.gradle

      - name: Verify Owl playback feature sources
        run: |
          grep -q 'videoAutoRotate' app/src/main/res/layout/activity_apv_settings.xml
          grep -q 'screenModeBtn' app/src/main/res/layout/player.xml
          grep -q 'playlist-start' app/src/main/java/is/xyz/mpv/BaseMPVView.kt
          grep -q 'displayedVideos' app/src/main/java/is/xyz/mpv/FolderActivity.kt
          grep -q 'video-zoom' app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'video-pan-x' app/src/main/java/is/xyz/mpv/TouchGestures.kt

      - name: Restore stable Owl signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d .github/owl-signing/debug-keystore.b64 > "$HOME/.android/debug.keystore"
          echo '27809b3ba39dc05131743472fc76a69b1ced9c36b97dd658eabecdbdb4df6bf7  '$HOME'/.android/debug.keystore' | sha256sum -c -
          chmod 600 "$HOME/.android/debug.keystore"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          text = p.read_text()
          marker = 'android {\n'
          signing = '''android {
              signingConfigs {
                  getByName("debug") {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          text = text.replace(marker, signing, 1)
          p.write_text(text)
          PY

      - name: Restore verified Owl PNG
        run: |
          base64 -d .github/owl-icon-source/icon192.b64 > /tmp/owl_launcher_icon.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          source = Path('/tmp/owl_launcher_icon.png')
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest == '9f8ad69dffea19a55f0270971220c20b332970728a40edcc7cbc3ec0c15c9bd6'
          with Image.open(source) as im:
              im.load()
              master = im.convert('RGBA')
          for folder, size in {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }.items():
              out = Path('app/src/main/res') / folder / 'owl_launcher_icon.png'
              out.parent.mkdir(parents=True, exist_ok=True)
              master.resize((size, size), Image.Resampling.LANCZOS).save(out, 'PNG')
          PY
          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_icon.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_foreground.xml
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_art.webp
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_icon.webp

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build Owl APKs
        run: DONT_BUILD_RELEASE=1 buildscripts/include/ci.sh build

      - name: Verify stable APK signature
        run: |
          APK=app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file /tmp/owl-cert.der
          EXPECTED=$(sha256sum /tmp/owl-cert.der | awk '{print $1}')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk Owl-0.3.2-arm64.apk
          sha256sum Owl-0.3.2-arm64.apk > Owl-0.3.2-arm64.sha256

      - name: Upload Owl APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owl-0.3.2-arm64
          path: |
            Owl-0.3.2-arm64.apk
            Owl-0.3.2-arm64.sha256
          if-no-files-found: error
          retention-days: 30
