name: Fix Owl Playlist Extra

on:
  push:
    paths:
      - 'scripts/fix-playlist-extra.py'
      - '.github/workflows/fix-playlist-extra.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch MPVActivity
        run: python3 scripts/fix-playlist-extra.py
      - name: Verify fix
        run: |
          grep -q 'getStringArrayListExtra("owl_playlist_uris")' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          ! grep -q 'FolderActivity.EXTRA_OWL_PLAYLIST' app/src/main/java/is/xyz/mpv/MPVActivity.kt
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/is/xyz/mpv/MPVActivity.kt
          git commit -m 'Fix Owl sorted playlist extra reference'
          git push origin HEAD:main
