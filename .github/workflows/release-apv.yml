name: Release Owl

on:
  push:
    branches: [main, "maintenance/**", "feature/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    env:
      OWL_NATIVE_ARCHS: arm64
      OWL_KEYSTORE_PATH: ${{ github.workspace }}/../owl-release.p12
      OWL_STORE_PASSWORD: ${{ secrets.OWL_STORE_PASSWORD }}
      OWL_KEY_PASSWORD: ${{ secrets.OWL_KEY_PASSWORD }}
      OWL_KEY_ALIAS: ${{ secrets.OWL_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Read application release version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-diagnostic\.[0-9]+)?$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          echo "OWL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OWL_ARM64_CODE=$((CODE + 2000))" >> "$GITHUB_ENV"

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> $GITHUB_ENV

      - uses: actions/cache@v6
        id: native-cache
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson pillow --break-system-packages

      - name: Verify protected playback core baseline and pan contract
        run: |
          cat > /tmp/owl-protected-core.sha256 <<'EOF'
          cc42b688f554b911ef3bb2d695d07f8ac8cb2630abfe5471775b49717e30a783  app/src/main/java/is/xyz/mpv/MPVLib.kt
          90334a608653afcb780ac967c9905d2aad2c15a537cb429560bd3739e8df1ace  app/src/main/java/is/xyz/mpv/BaseMPVView.kt
          97346f93971d56b4efe3ca8ec5f67c5fcb89718cbb3d9e0a9454210c9763d35c  app/src/main/java/is/xyz/mpv/MPVView.kt
          6baf03bfa52ee9ed4542a74f7e51a526009565a220cc767bb03533bc2c473c98  app/src/main/jni/Android.mk
          32f7151a08f806dcf9ef96497ddec824105cd1baa7ef068e9a2899fae8d683de  app/src/main/jni/Application.mk
          ff9414a6d5669ea0477c06095354784fe0fc53dbaa58558de6c6912979954614  app/src/main/jni/event.cpp
          906952620c7093a37136e3f3ccb06b9eb7f2e49f435bba76e8da8c038cc521f8  app/src/main/jni/event.h
          feb2005a32a303d41a2fa4ac551a21ef9f2218d59d6d96fc78dbaecab5a87695  app/src/main/jni/globals.h
          99dced62480bd0b47d4431bfcb135a0e4346081c9619f771d0f55fe2d5684349  app/src/main/jni/jni_utils.cpp
          8bb5b9c597ae0e3a0e3480bff12b91c1c32ab6aed1b54e08df8fa027d1944903  app/src/main/jni/jni_utils.h
          e7822acbca4c320c00a16409deca2ec592ce125d321c3767b12cba8ff5e5f938  app/src/main/jni/log.cpp
          cc7b805ba9cf45490d9821fa3243422f0077478a604065fae759fc6c38d0e10d  app/src/main/jni/log.h
          265d72935e35b0cdfc82d7b80768e0d039531a46d2ab2d434f1ca1a189578f03  app/src/main/jni/main.cpp
          e27e1a63844c39ec7b34e732356705caaa3d7c495381ab560363a0e470ed26cc  app/src/main/jni/property.cpp
          0b0e88150e59d0c65c95a9393e875e15ca7c7f08b473a7909985d9265ded3902  app/src/main/jni/render.cpp
          c2fa4747b5f6b0dbd46754da8a21e1d816ff1a5952ebd1d5611b88f8bb34064e  app/src/main/jni/thumbnail.cpp
          3d6693d3ef359437ca54cabaadb973901a95198d4d917a4438d8bf285af3f6fe  buildscripts/scripts/ffmpeg.sh
          030fa9e5893ae3cea8d3dbb1ac35846a26047b4552363c1a8252c259722e6b74  buildscripts/scripts/libass.sh
          7cd7f3a6c9f7da6176be5bfc0c6d3c0be39ea5582919f3b6dd2ddb82a6342953  buildscripts/scripts/libplacebo.sh
          043338c15fbbd79e505a7f96c3436fc6ba16f81e4cbd41351742e2d65f632853  buildscripts/scripts/mpv.sh
          33fd2e40e11c45dc3ebd92f6b1bca51aba79339e31abdfc4545cab280fd5e95c  buildscripts/scripts/mpv-android.sh
          ad7b8643fdb7fe403a70ee682ab4a55dc11db9d7d3ecefd0d948a6030234e2d2  app/src/main/jni/render_pass_stats.h
          a69956145ee1d270c61826734e5d51501714667a8359c8db28203f409f71c699  app/src/main/java/is/xyz/mpv/TouchGestures.kt
          EOF
          sha256sum -c /tmp/owl-protected-core.sha256
          GESTURE=app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'private const val PAN_SENSITIVITY = 0.55' "$GESTURE"
          grep -q 'private const val PAN_JITTER_DEADZONE_FRACTION = 0.0035f' "$GESTURE"
          grep -q 'private const val PINCH_SCALE_DEADZONE = 0.003' "$GESTURE"
          grep -q 'MPVLib.setPropertyDouble("video-align-x", alignX)' "$GESTURE"
          grep -q 'MPVLib.setPropertyDouble("video-align-y", alignY)' "$GESTURE"
          ! grep -q 'PAN_SMOOTHING_KEEP' "$GESTURE"

      - name: Verify pinned neural models and licenses
        run: python3 tools/validate_neural_assets.py

      - name: Restore private Owl release key
        env:
          KEYSTORE_B64: ${{ secrets.OWL_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf "%s" "$KEYSTORE_B64" | base64 -d > "$OWL_KEYSTORE_PATH"
          chmod 600 "$OWL_KEYSTORE_PATH"

      - name: Restore verified Owl PNG and create standard mipmaps
        run: |
          base64 -d .github/owl-icon-source/icon192.b64 > /tmp/owl_launcher_icon.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          source = Path('/tmp/owl_launcher_icon.png')
          raw = source.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = '9f8ad69dffea19a55f0270971220c20b332970728a40edcc7cbc3ec0c15c9bd6'
          assert digest == expected, (digest, expected)

          with Image.open(source) as im:
              im.load()
              assert im.format == 'PNG'
              assert im.size == (192, 192)
              master = im.convert('RGBA')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out = Path('app/src/main/res') / folder / 'owl_launcher_icon.png'
              out.parent.mkdir(parents=True, exist_ok=True)
              master.resize((size, size), Image.Resampling.LANCZOS).save(out, 'PNG', optimize=True)
          PY
          cp /tmp/owl_launcher_icon.png app/src/main/res/drawable-nodpi/owl_launcher_source.png
          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_icon.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_foreground.xml
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_art.webp
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_icon.webp

      - name: Unit tests and lint
        run: ./gradlew testAllstorageDebugUnitTest lintAllstorageRelease

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Preserve verified native dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"

      - name: Create disposable CI debug key for internal test variants
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Debug"
          fi

      - name: Build Owl APKs
        run: buildscripts/include/ci.sh build

      - name: Verify release artifact
        run: |
          APK=app/build/outputs/apk/allstorage/release/app-allstorage-arm64-v8a-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='com.phanni221b.owlplayer' versionCode='$OWL_ARM64_CODE' versionName='${{ env.OWL_VERSION }}-allstorage'" /tmp/badging.txt
          ! grep -q 'application-debuggable' /tmp/badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/badging.txt
          grep -q "application-label:'Owl'" /tmp/badging.txt
          grep -q "launchable-activity: name='is.xyz.mpv.MainActivity'" /tmp/badging.txt
          "$APKSIGNER" verify --print-certs "$APK" > signing.txt
          EXPECTED=$(cat .github/owl-signing/release-cert.sha256)
          ACTUAL=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' signing.txt)
          test "$ACTUAL" = "$EXPECTED"
          python3 tools/verify_release_payload.py "$APK"
          cp "$APK" Owl-${{ env.OWL_VERSION }}-arm64.apk
          sha256sum Owl-${{ env.OWL_VERSION }}-arm64.apk > Owl-${{ env.OWL_VERSION }}-arm64.sha256
          cp buildscripts/include/native-revisions.sh native-revisions.txt
          printf 'commit=%s\nvariant=allstorageRelease\napplicationId=com.phanni221b.owlplayer\n' "$GITHUB_SHA" > build-info.txt
          cat native-revisions.txt signing.txt >> build-info.txt
          bash -c '. buildscripts/include/depinfo.sh; set | grep -E "^(v_|rev_)"' >> build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Owl-${{ env.OWL_VERSION }}-arm64-release
          path: |
            Owl-${{ env.OWL_VERSION }}-arm64.apk
            Owl-${{ env.OWL_VERSION }}-arm64.sha256
            build-info.txt
            native-revisions.txt
            app/build/reports/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/maintenance/release-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            EXPECTED_BRANCH="maintenance/release-v$OWL_VERSION"
            test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
            TAG="v$OWL_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Refusing to replace existing tag $TAG" >&2
              exit 1
            fi
            git config user.name "Owl Release Automation"
            git config user.email "actions@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Owl $OWL_VERSION"
            git push origin "refs/tags/$TAG"
          fi
          test "$TAG" = "v$OWL_VERSION"
          gh release create "$TAG" Owl-${{ env.OWL_VERSION }}-arm64.apk Owl-${{ env.OWL_VERSION }}-arm64.sha256 build-info.txt native-revisions.txt --verify-tag --title "Owl ${{ env.OWL_VERSION }}" --notes-file docs/release-${{ env.OWL_VERSION }}.md

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$OWL_KEYSTORE_PATH"
