name: Release Owl

on:
  push:
    paths:
      - '.github/workflows/release-apv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson pillow --break-system-packages

      - name: Restore verified Owl PNG and create standard mipmaps
        run: |
          base64 -d .github/owl-icon-source/icon192.b64 > /tmp/owl_launcher_icon.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          source = Path('/tmp/owl_launcher_icon.png')
          raw = source.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = '9f8ad69dffea19a55f0270971220c20b332970728a40edcc7cbc3ec0c15c9bd6'
          assert digest == expected, (digest, expected)

          with Image.open(source) as im:
              im.load()
              assert im.format == 'PNG', im.format
              assert im.size == (192, 192), im.size
              master = im.convert('RGBA')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out = Path('app/src/main/res') / folder / 'owl_launcher_icon.png'
              out.parent.mkdir(parents=True, exist_ok=True)
              master.resize((size, size), Image.Resampling.LANCZOS).save(out, 'PNG', optimize=True)
              with Image.open(out) as check:
                  check.load()
                  assert check.format == 'PNG'
                  assert check.size == (size, size)
              print('generated', out, size)
          print('verified source SHA-256', digest)
          PY

          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_icon.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_foreground.xml
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_art.webp
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_icon.webp

          grep -q 'android:icon="@mipmap/owl_launcher_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/owl_launcher_icon"' app/src/main/AndroidManifest.xml
          ! grep -q 'mpv_launcher_icon' app/src/main/AndroidManifest.xml

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build Owl APKs
        run: DONT_BUILD_RELEASE=1 buildscripts/include/ci.sh build

      - name: Verify final APK launcher icon
        run: |
          APK=app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/owl-badging.txt

          grep -q "application-label:'Owl'" /tmp/owl-badging.txt
          grep -q "launchable-activity: name='is.xyz.mpv.MainActivity'" /tmp/owl-badging.txt
          grep -Eq "application-icon-[0-9]+:'res/mipmap-[^']*/owl_launcher_icon\.png'" /tmp/owl-badging.txt
          ! grep -Eq "application-icon-[0-9]+:'res/[^']*mpv_launcher_icon" /tmp/owl-badging.txt

          rm -rf /tmp/owl-apk
          mkdir /tmp/owl-apk
          unzip -q "$APK" -d /tmp/owl-apk
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          icons = sorted(Path('/tmp/owl-apk/res').rglob('owl_launcher_icon.png'))
          assert icons, 'No Owl launcher PNGs found in APK'
          for p in icons:
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'PNG'
                  print('APK icon OK', p, im.size)
          PY

          echo '--- final launcher mapping ---'
          grep -E 'application-label|application-icon|launchable-activity' /tmp/owl-badging.txt | head -30

      - name: Prepare Owl arm64 APK
        run: |
          cp app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk Owl-0.3.0-arm64.apk
          sha256sum Owl-0.3.0-arm64.apk > Owl-0.3.0-arm64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.3.0 --yes 2>/dev/null || true
          git push origin :refs/tags/v0.3.0 2>/dev/null || true
          gh release create v0.3.0 \
            Owl-0.3.0-arm64.apk \
            Owl-0.3.0-arm64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Owl 0.3.0" \
            --notes "MX-style usability update: Hermès-inspired orange theme, responsive Fold layout, folder and video sorting, lazy thumbnails, video metadata, automatic resume progress, MX-style gestures, simplified player controls, and existing mpv subtitle/hardware decode/upscaling support preserved."
