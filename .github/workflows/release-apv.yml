name: Release Apv

on:
  push:
    paths:
      - '.github/workflows/release-apv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson --break-system-packages

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build Apv APKs
        run: DONT_BUILD_RELEASE=1 buildscripts/include/ci.sh build

      - name: Prepare Apv arm64 APK
        run: |
          cp app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk Apv-0.1.0-arm64.apk
          sha256sum Apv-0.1.0-arm64.apk > Apv-0.1.0-arm64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.0 --yes 2>/dev/null || true
          git push origin :refs/tags/v0.1.0 2>/dev/null || true
          gh release create v0.1.0 \
            Apv-0.1.0-arm64.apk \
            Apv-0.1.0-arm64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Apv 0.1.0" \
            --notes "Apv 0.1.0 initial build. Folder-first video library, external storage support, three upscaling modes, hardware decoding by default, and mpv/libass subtitle support."
