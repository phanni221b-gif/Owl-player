name: Release Owl

on:
  push:
    paths:
      - '.github/workflows/release-apv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson pillow --break-system-packages

      - name: Set Owl 0.3.5 version
        run: |
          sed -i 's/versionCode 55/versionCode 60/' app/build.gradle
          sed -i 's/versionName "0.3.0"/versionName "0.3.5"/' app/build.gradle
          grep -q 'versionCode 60' app/build.gradle
          grep -q 'versionName "0.3.5"' app/build.gradle

      - name: Patch stable Previous Next control logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/is/xyz/mpv/MPVActivity.kt')
          text = p.read_text()

          pattern = re.compile(
              r'\s*val audioButtons = arrayOf\(R\.id\.prevBtn, R\.id\.cycleAudioBtn, R\.id\.playBtn,\s*'
              r'R\.id\.cycleSpeedBtn, R\.id\.nextBtn\)\s*'
              r'val videoButtons = arrayOf\(R\.id\.cycleAudioBtn, R\.id\.cycleSubsBtn, R\.id\.playBtn,\s*'
              r'R\.id\.cycleDecoderBtn, R\.id\.screenModeBtn, R\.id\.cycleSpeedBtn\)'
          )
          replacement = '''
              val audioButtons = arrayOf(R.id.cycleAudioBtn, R.id.prevBtn, R.id.playBtn,
                  R.id.nextBtn, R.id.cycleSpeedBtn)
              val videoButtons = arrayOf(R.id.cycleAudioBtn, R.id.cycleSubsBtn, R.id.prevBtn,
                  R.id.playBtn, R.id.nextBtn, R.id.cycleDecoderBtn,
                  R.id.screenModeBtn, R.id.cycleSpeedBtn)'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'button order block matches={count}')

          text = text.replace('        val seekbarGroup = binding.controlsSeekbarGroup\n', '')
          text = text.replace('            // Move prev/next file from seekbar group to buttons group\n', '')
          for line in (
              '            Utils.viewGroupMove(seekbarGroup, R.id.prevBtn, buttonGroup, 0)\n',
              '            Utils.viewGroupMove(seekbarGroup, R.id.nextBtn, buttonGroup, -1)\n',
              '            Utils.viewGroupMove(buttonGroup, R.id.prevBtn, seekbarGroup, 0)\n',
              '            Utils.viewGroupMove(buttonGroup, R.id.nextBtn, seekbarGroup, -1)\n',
          ):
              text = text.replace(line, '')

          text = text.replace(
              '        if (!useAudioUI && plCount == 1) {',
              '        if (plCount <= 1) {',
              1
          )

          if 'viewGroupMove(seekbarGroup, R.id.prevBtn' in text:
              raise SystemExit('legacy prev reparent still present')
          if 'viewGroupMove(buttonGroup, R.id.prevBtn' in text:
              raise SystemExit('legacy reverse prev reparent still present')
          if 'R.id.cycleSubsBtn, R.id.prevBtn' not in text:
              raise SystemExit('new video button order missing')
          if 'if (plCount <= 1)' not in text:
              raise SystemExit('playlist visibility guard missing')

          p.write_text(text)
          PY

      - name: Verify Owl 0.3.5 feature sources
        run: |
          grep -q 'videoAutoRotate' app/src/main/res/layout/activity_apv_settings.xml
          grep -q 'screenModeBtn' app/src/main/res/layout/player.xml
          grep -q 'android:id="@+id/prevBtn"' app/src/main/res/layout/player.xml
          grep -q 'android:id="@+id/nextBtn"' app/src/main/res/layout/player.xml
          grep -q 'android:id="@+id/playBtn"' app/src/main/res/layout/player.xml
          grep -q 'R.id.cycleSubsBtn, R.id.prevBtn' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          ! grep -q 'viewGroupMove(seekbarGroup, R.id.prevBtn' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          ! grep -q 'viewGroupMove(buttonGroup, R.id.prevBtn' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          grep -q 'if (plCount <= 1)' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          grep -q 'val playlistEntries = displayedVideos.map' app/src/main/java/is/xyz/mpv/FolderActivity.kt
          grep -q 'Utils.makeMemoryPlaylist(playlistEntries)' app/src/main/java/is/xyz/mpv/FolderActivity.kt
          grep -q 'PAN_SENSITIVITY = 0.45' app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'PAN_JITTER_DEADZONE_FRACTION' app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'PAN_SMOOTHING_KEEP' app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'PINCH_SCALE_DEADZONE' app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'video-align-x' app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'video-align-y' app/src/main/java/is/xyz/mpv/TouchGestures.kt
          grep -q 'android:id="@+id/mainSelectionBar"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/videoSelectionBar"' app/src/main/res/layout/activity_folder.xml
          grep -q 'confirmDeleteSelectedFolders' app/src/main/java/is/xyz/mpv/MainActivity.kt
          grep -q 'confirmDeleteSelectedVideos' app/src/main/java/is/xyz/mpv/FolderActivity.kt
          grep -q 'deleteRecursively' app/src/main/java/is/xyz/mpv/OwlFileOperations.kt

      - name: Restore and force stable Owl development signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d .github/owl-signing/debug-keystore.b64 > "$HOME/.android/debug.keystore"
          echo '27809b3ba39dc05131743472fc76a69b1ced9c36b97dd658eabecdbdb4df6bf7  '$HOME'/.android/debug.keystore' | sha256sum -c -
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          chmod 600 "$HOME/.android/debug.keystore"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          text = p.read_text()
          marker = 'android {\n'
          signing = '''android {
              signingConfigs {
                  getByName("debug") {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          if marker not in text:
              raise SystemExit('android block not found')
          text = text.replace(marker, signing, 1)
          p.write_text(text)
          PY

          grep -q 'storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")' app/build.gradle

      - name: Restore verified Owl PNG and create standard mipmaps
        run: |
          base64 -d .github/owl-icon-source/icon192.b64 > /tmp/owl_launcher_icon.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          source = Path('/tmp/owl_launcher_icon.png')
          raw = source.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = '9f8ad69dffea19a55f0270971220c20b332970728a40edcc7cbc3ec0c15c9bd6'
          assert digest == expected, (digest, expected)

          with Image.open(source) as im:
              im.load()
              assert im.format == 'PNG', im.format
              assert im.size == (192, 192), im.size
              master = im.convert('RGBA')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out = Path('app/src/main/res') / folder / 'owl_launcher_icon.png'
              out.parent.mkdir(parents=True, exist_ok=True)
              master.resize((size, size), Image.Resampling.LANCZOS).save(out, 'PNG', optimize=True)
              with Image.open(out) as check:
                  check.load()
                  assert check.format == 'PNG'
                  assert check.size == (size, size)
          print('verified source SHA-256', digest)
          PY

          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_icon.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_foreground.xml
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_art.webp
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_icon.webp

          grep -q 'android:icon="@mipmap/owl_launcher_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/owl_launcher_icon"' app/src/main/AndroidManifest.xml
          ! grep -q 'mpv_launcher_icon' app/src/main/AndroidManifest.xml

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build Owl APKs
        run: DONT_BUILD_RELEASE=1 buildscripts/include/ci.sh build

      - name: Verify final APK icon and stable signature
        run: |
          APK=app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/owl-badging.txt

          grep -q "application-label:'Owl'" /tmp/owl-badging.txt
          grep -q "launchable-activity: name='is.xyz.mpv.MainActivity'" /tmp/owl-badging.txt
          grep -Eq "application-icon-[0-9]+:'res/mipmap-[^']*/owl_launcher_icon\.png'" /tmp/owl-badging.txt
          ! grep -Eq "application-icon-[0-9]+:'res/[^']*mpv_launcher_icon" /tmp/owl-badging.txt

          keytool -exportcert \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -file /tmp/owl-cert.der
          EXPECTED_CERT=$(sha256sum /tmp/owl-cert.der | awk '{print $1}')

          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/owl-signing.txt
          ACTUAL_CERT=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/owl-signing.txt | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')

          echo "Expected keystore certificate: $EXPECTED_CERT"
          echo "Actual APK certificate:        $ACTUAL_CERT"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          rm -rf /tmp/owl-apk
          mkdir /tmp/owl-apk
          unzip -q "$APK" -d /tmp/owl-apk
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          icons = sorted(Path('/tmp/owl-apk/res').rglob('owl_launcher_icon.png'))
          assert icons, 'No Owl launcher PNGs found in APK'
          for p in icons:
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'PNG'
          PY

      - name: Prepare Owl arm64 APK
        run: |
          cp app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk Owl-0.3.5-arm64.apk
          sha256sum Owl-0.3.5-arm64.apk > Owl-0.3.5-arm64.sha256

      - name: Preserve Owl 0.3.5 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owl-0.3.5-arm64
          path: |
            Owl-0.3.5-arm64.apk
            Owl-0.3.5-arm64.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.3.5 --yes 2>/dev/null || true
          git push origin :refs/tags/v0.3.5 2>/dev/null || true
          gh release create v0.3.5 \
            Owl-0.3.5-arm64.apk \
            Owl-0.3.5-arm64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Owl 0.3.5" \
            --notes "Fixes the crash when switching to Previous/Next video by removing legacy control reparenting that still expected those buttons inside the seek bar. Previous/Play/Next now stay together in the lower icon row with equal spacing instead of being pinned to the far edges. The playback playlist remains a fixed snapshot of the exact folder sort order visible when playback starts; Owl does not rescan or reorder files live during playback. Keeps permanent multi-select delete/move, bounded stabilized two-finger pan, 8x pinch zoom, HW+ -> HW -> SW Auto decoding, stable signing, subtitles, upscaling and foldable resizing."