name: Release Owl

on:
  push:
    paths:
      - '.github/workflows/release-apv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson --break-system-packages

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build Owl APKs
        run: DONT_BUILD_RELEASE=1 buildscripts/include/ci.sh build

      - name: Verify merged manifest uses Owl icon
        run: |
          MERGED="app/build/intermediates/merged_manifests/allstorageDebug/processAllstorageDebugManifest/AndroidManifest.xml"
          if [ ! -f "$MERGED" ]; then
            MERGED=$(find app/build/intermediates -path '*allstorageDebug*' -name AndroidManifest.xml | head -1)
          fi
          test -n "$MERGED"
          grep -q 'mipmap/owl_launcher_icon' "$MERGED"
          ! grep -q 'mipmap/mpv_launcher_icon' "$MERGED"
          echo "Verified merged manifest: $MERGED"

      - name: Prepare Owl arm64 APK
        run: |
          cp app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk Owl-0.2.3-arm64.apk
          sha256sum Owl-0.2.3-arm64.apk > Owl-0.2.3-arm64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.2.3 --yes 2>/dev/null || true
          git push origin :refs/tags/v0.2.3 2>/dev/null || true
          gh release create v0.2.3 \
            Owl-0.2.3-arm64.apk \
            Owl-0.2.3-arm64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Owl 0.2.3" \
            --notes "Hardwires the intended glossy orange Owl launcher artwork in the base application and launcher activity manifests, instead of relying on the old mpv launcher icon path. The build also verifies the final merged manifest contains only the Owl launcher icon reference. Keeps the status-bar/inset fix and existing playback, upscaling and subtitle features."
