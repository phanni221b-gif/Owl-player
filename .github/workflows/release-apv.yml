name: Release Owl

on:
  push:
    paths:
      - '.github/workflows/release-apv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson pillow --break-system-packages

      - name: Rebuild launcher assets from canonical Owl artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src_path = Path('app/src/main/res/drawable-nodpi/owl_icon.webp')
          with Image.open(src_path) as src_im:
              src_im.load()
              print('Canonical artwork:', src_im.format, src_im.size, src_im.mode)
              assert src_im.format == 'WEBP', f'Unexpected format: {src_im.format}'
              assert src_im.width == src_im.height, f'Icon is not square: {src_im.size}'
              assert src_im.width >= 192, f'Icon is too small: {src_im.size}'
              src = src_im.convert('RGBA')

          # A clean, lossless 512px foreground for Android 8+ adaptive icons.
          fg = src.resize((512, 512), Image.Resampling.LANCZOS)
          fg_path = Path('app/src/main/res/drawable-nodpi/owl_launcher_source.png')
          fg_path.parent.mkdir(parents=True, exist_ok=True)
          fg.save(fg_path, format='PNG', optimize=False)

          # Proper legacy launcher bitmaps for Android 6/7 and any launcher that
          # requests density-specific fallback resources.
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out = Path('app/src/main/res') / folder / 'owl_launcher_icon.png'
              out.parent.mkdir(parents=True, exist_ok=True)
              src.resize((size, size), Image.Resampling.LANCZOS).save(out, format='PNG', optimize=False)
              with Image.open(out) as check:
                  check.load()
                  assert check.format == 'PNG'
                  assert check.size == (size, size)
                  print('Generated:', out, check.size, check.mode)

          with Image.open(fg_path) as check:
              check.load()
              assert check.format == 'PNG'
              assert check.size == (512, 512)
              print('Generated:', fg_path, check.size, check.mode)
          PY

          # These were the corrupt/indirect resources that caused the launcher fallback.
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_art.webp
          rm -f app/src/main/res/mipmap-xxxhdpi/owl_launcher_icon.webp
          rm -f app/src/main/res/mipmap-anydpi-v26/owl_launcher_foreground.xml

      - name: Verify launcher resource graph before build
        run: |
          grep -q 'android:icon="@mipmap/owl_launcher_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/owl_launcher_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:drawable="@drawable/owl_launcher_source"' app/src/main/res/mipmap-anydpi-v26/owl_launcher_icon.xml
          test -f app/src/main/res/drawable-nodpi/owl_launcher_source.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "app/src/main/res/mipmap-$d/owl_launcher_icon.png"
          done

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build Owl APKs
        run: DONT_BUILD_RELEASE=1 buildscripts/include/ci.sh build

      - name: Verify final APK launcher resources
        run: |
          APK=app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk
          test -f "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/owl-badging.txt
          grep -q "application-label:'Owl'" /tmp/owl-badging.txt
          grep -q 'application-icon-.*owl_launcher_icon' /tmp/owl-badging.txt
          grep -q "launchable-activity: name='is.xyz.mpv.MainActivity'.*owl_launcher_icon" /tmp/owl-badging.txt

          if unzip -Z1 "$APK" | grep -qE 'owl_launcher_(art|icon)\.webp$'; then
            echo 'ERROR: corrupt/obsolete launcher WebP survived into APK'
            exit 1
          fi

          ICON_PATH=$(unzip -Z1 "$APK" | grep 'owl_launcher_source.png$' | head -1)
          test -n "$ICON_PATH"
          unzip -p "$APK" "$ICON_PATH" > /tmp/owl_launcher_source.png
          python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/owl_launcher_source.png') as im:
              im.load()
              assert im.format == 'PNG'
              assert im.size == (512, 512)
              print('APK adaptive foreground OK:', im.size, im.mode)
          PY

          LEGACY_PATH=$(unzip -Z1 "$APK" | grep -E 'res/mipmap-.*?/owl_launcher_icon\.png$' | tail -1)
          test -n "$LEGACY_PATH"
          unzip -p "$APK" "$LEGACY_PATH" > /tmp/owl_launcher_legacy.png
          python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/owl_launcher_legacy.png') as im:
              im.load()
              assert im.format == 'PNG'
              assert im.width >= 48 and im.height >= 48
              print('APK legacy launcher bitmap OK:', im.size, im.mode)
          PY

          echo 'Final APK launcher references:'
          grep -E 'application-icon|launchable-activity' /tmp/owl-badging.txt | head -20

      - name: Prepare Owl arm64 APK
        run: |
          cp app/build/outputs/apk/allstorage/debug/app-allstorage-arm64-v8a-debug.apk Owl-0.2.4-arm64.apk
          sha256sum Owl-0.2.4-arm64.apk > Owl-0.2.4-arm64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.2.4 --yes 2>/dev/null || true
          git push origin :refs/tags/v0.2.4 2>/dev/null || true
          gh release create v0.2.4 \
            Owl-0.2.4-arm64.apk \
            Owl-0.2.4-arm64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Owl 0.2.4" \
            --notes "Launcher icon root-cause fix. The release now treats owl_icon.webp as the canonical artwork, decodes it first, regenerates clean lossless PNG resources for every legacy density plus the Android 8+ adaptive foreground, removes the corrupt WebP launcher chain, and then re-opens the icon files extracted from the finished APK before publishing. If any source or packaged icon cannot be decoded, the release is blocked."
