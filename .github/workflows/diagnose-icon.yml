name: Diagnose Owl APK Icon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-icon.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download released APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.3 --pattern 'Owl-0.2.3-arm64.apk' --dir diag
      - name: Collect source icon files
        run: |
          mkdir -p diag/source
          cp app/src/main/res/mipmap-anydpi-v26/owl_launcher_icon.xml diag/source/ || true
          cp app/src/main/res/mipmap-anydpi-v26/owl_launcher_foreground.xml diag/source/ || true
          cp app/src/main/res/mipmap-xxxhdpi/owl_launcher_art.webp diag/source/ || true
          cp app/src/main/res/mipmap-xxxhdpi/owl_launcher_icon.webp diag/source/ || true
          sha256sum diag/source/* > diag/source-sha256.txt || true
      - name: Dump APK package and manifest
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging diag/Owl-0.2.3-arm64.apk > diag/aapt-badging.txt
          "$AAPT" dump xmltree diag/Owl-0.2.3-arm64.apk AndroidManifest.xml > diag/manifest-tree.txt
          unzip -l diag/Owl-0.2.3-arm64.apk > diag/apk-file-list.txt
          grep -i -E 'owl_launcher|mpv_launcher|application-icon|launchable-activity' diag/aapt-badging.txt diag/manifest-tree.txt diag/apk-file-list.txt > diag/icon-lines.txt || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: owl-icon-diagnostics
          path: diag/
          compression-level: 0
