name: Apply Owl Player Controls

on:
  push:
    paths:
      - 'scripts/apply-player-controls.py'
      - '.github/workflows/apply-player-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 scripts/apply-player-controls.py

      - name: Verify expected Owl controls are present
        run: |
          grep -q 'screenModeBtn.setOnClickListener' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          grep -q 'FolderActivity.EXTRA_OWL_PLAYLIST' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          grep -q 'playlist_index' app/src/main/java/is/xyz/mpv/MPVActivity.kt
          grep -q 'SCREEN_MODE_FILL' app/src/main/java/is/xyz/mpv/MPVActivity.kt

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/is/xyz/mpv/MPVActivity.kt
          git commit -m 'Add Owl screen modes and sorted playlist navigation'
          git push origin HEAD:main
