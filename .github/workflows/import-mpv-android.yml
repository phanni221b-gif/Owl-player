name: Import mpv-android source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import pinned mpv-android source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/mpv-android/mpv-android.git || true
          git fetch --depth=1 upstream f700f6f740a15e774452603a00acc88d126c2753:refs/remotes/upstream/import-snapshot

          git fetch origin main
          git checkout -B main origin/main

          git rm -r --ignore-unmatch .
          git checkout refs/remotes/upstream/import-snapshot -- .

          git add -A
          git commit -m "Import mpv-android source at f700f6f"
          git push origin HEAD:main
